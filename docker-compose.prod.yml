services:
  # 1. In-Memory Pub/Sub & Session Cache (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: nerdshive-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3G

  # 2. Database Persistence (MongoDB 7.0 - Fallback if Atlas not provided)
  mongo:
    image: mongo:7.0
    container_name: nerdshive-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G

  # 3. Real-Time WebSocket Gateway & WebRTC Signaling Hub
  signaling:
    build:
      context: ./apps/signaling-server
      dockerfile: Dockerfile
    container_name: nerdshive-signaling
    restart: always
    environment:
      - PORT=10000
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=https://nerdshive.online,http://localhost:3000,http://localhost:10000,*
    ports:
      - "10000:10000"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G

  # 4. Next.js 14 Web Application & Edge BFF
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nerdshive-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/nerdshive}
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SOCKET_SERVER_URL=${NEXT_PUBLIC_SOCKET_SERVER_URL:-http://localhost:10000}
      - AUTH_SECRET=${AUTH_SECRET:-nerdshive_secret_key_production_2026}
      - AUTH_TRUST_HOST=true
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - signaling
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 8G

  # 5. Edge Reverse Proxy with WebSocket Upgrades (Nginx)
  nginx:
    image: nginx:alpine
    container_name: nerdshive-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - signaling
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
