syntax = "proto3";

package chat;

service ChatService {
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  rpc GetChatHistory (GetChatHistoryRequest) returns (GetChatHistoryResponse);
  rpc GetRecentConversations (GetRecentConversationsRequest) returns (GetRecentConversationsResponse);
}

message SendMessageRequest {
  string senderId = 1;
  string recipientId = 2;
  string content = 3;
}

message SendMessageResponse {
  bool success = 1;
  string messageId = 2;
  string timestamp = 3;
  string roomId = 4;
}

message GetChatHistoryRequest {
  string roomId = 1;
  int32 limit = 2;
  string beforeTimestamp = 3;
}

message ChatMessageDto {
  string id = 1;
  string senderId = 2;
  string recipientId = 3;
  string content = 4;
  string timestamp = 5;
}

message GetChatHistoryResponse {
  repeated ChatMessageDto messages = 1;
}

message GetRecentConversationsRequest {
  string userId = 1;
}

message ConversationSummaryDto {
  string roomId = 1;
  string partnerId = 2;
  string partnerUsername = 3;
  string partnerAvatar = 4;
  string lastMessage = 5;
  string lastTimestamp = 6;
  int32 unreadCount = 7;
}

message GetRecentConversationsResponse {
  repeated ConversationSummaryDto conversations = 1;
}
